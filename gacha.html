<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GACHA VAULT</title>
    <style>
        body { background-color: #0b0b0b; color: #e0e0e0; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle, #222 1px, transparent 1px); background-size: 15px 15px; }
        .container { max-width: 550px; width: 100%; background: #151515; border: 2px solid #ffb300; padding: 30px; box-shadow: 0 0 40px rgba(255,179,0,0.3); text-align: center; border-radius: 8px; position: relative; overflow: hidden; }
        .container::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, rgba(255, 179, 0, 0.2), transparent 30%); animation: rotate 4s linear infinite; z-index: 0; pointer-events: none; }
        @keyframes rotate { 100% { transform: rotate(1turn); } }
        
        .content-box { position: relative; z-index: 1; }
        h1 { color: #ffeb3b; letter-spacing: 3px; margin-top: 0; font-size: 28px; text-shadow: 0 0 10px rgba(255, 235, 59, 0.5); }
        .ticket-box { background: #000; border: 1px dashed #00ff00; padding: 12px; margin: 20px auto 30px auto; color: #00ff00; font-weight: bold; width: 80%; font-size: 16px; border-radius: 5px; }
        .ticket-number { font-size: 24px; color: #ffeb3b; margin: 0 5px; }
        .vault-machine { font-size: 90px; margin: 25px 0; cursor: pointer; user-select: none; transition: 0.2s; display: inline-block; filter: drop-shadow(0 0 15px rgba(255, 179, 0, 0.6)); }
        .vault-machine:hover { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(255, 179, 0, 0.9)); }
        .vault-machine:active { transform: scale(0.95); }

        .btn-pull { background: #d32f2f; color: white; border: 2px solid #ff5252; padding: 16px 30px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit; letter-spacing: 2px; width: 100%; margin-top: 20px; transition: 0.2s; border-radius: 5px; }
        .btn-pull:hover { background: #b71c1c; box-shadow: 0 0 20px rgba(211,47,47,0.8); }
        .btn-pull:disabled { background: #333; border-color: #555; color: #777; cursor: not-allowed; box-shadow: none; }
        .btn-back { background: transparent; color: #888; border: 1px dashed #555; padding: 12px; width: 100%; margin-top: 15px; cursor: pointer; font-family: inherit; transition: 0.2s; border-radius: 5px; font-weight: bold; }
        .btn-back:hover { background: #222; color: #fff; border-color: #aaa; }

        #reward-display { margin-top: 25px; font-size: 18px; color: #ffeb3b; min-height: 80px; font-weight: bold; padding: 15px; background: rgba(0,0,0,0.5); border-radius: 5px; border: 1px solid #333; }
        .reward-name { font-size: 24px; display: block; margin-top: 10px; text-shadow: 0 0 10px currentColor; }
        
        .rarity-common { color: #00ff00; }
        .rarity-rare { color: #00bfff; }
        .rarity-epic { color: #b15bfa; }
        .rarity-legendary { color: #ffb300; }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-box">
            <h1>🔐 THE GACHA VAULT</h1>
            <p style="color: #aaa; font-size: 14px; margin-bottom: 5px;">ใช้ตั๋วสายลับ 1 ใบ เพื่อสุ่มหากระเป๋าไอเทมและสกินระดับแรร์!</p>
            
            <div class="ticket-box">🎟️ ตั๋วสุ่มคงเหลือ: <span class="ticket-number" id="ticket-count">0</span> ใบ</div>
            <div class="vault-machine" id="vault-icon" onclick="pullGacha()">🎰</div>
            <div id="reward-display">กดตู้กาชา หรือปุ่มด้านล่างเพื่อเสี่ยงโชค!</div>

            <button class="btn-pull" id="pull-btn" onclick="pullGacha()">DRAW REWARD (ใช้ตั๋ว 1 ใบ)</button>
            <button class="btn-back" onclick="goDashboard()">◀ กลับสู่ศูนย์บัญชาการ</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby4Ji-VVWI2IOzYvTcdwltergbdWGfxru32TjoPCMQxc_EZeiTGT_9XAVcAVrjhXj_wpQ/exec';
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;
            
            if (type === 'spin') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.3);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'epic') {
                osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554.37, now + 0.1); osc.frequency.setValueAtTime(659.25, now + 0.2); osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.start(now); osc.stop(now + 0.8);
            }
        }

        let agentData = JSON.parse(localStorage.getItem('agentData'));

        document.addEventListener("DOMContentLoaded", () => {
            if (!agentData) { window.location.href = 'index.html'; return; }
            updateTicketUI();
        });

        function updateTicketUI() {
            let currentTickets = parseInt(agentData.tickets) || 0;
            document.getElementById('ticket-count').innerText = currentTickets;
            
            const pullBtn = document.getElementById('pull-btn');
            if (currentTickets <= 0) {
                pullBtn.disabled = true; pullBtn.innerText = "NO TICKETS LEFT";
            } else {
                pullBtn.disabled = false; pullBtn.innerText = "DRAW REWARD (ใช้ตั๋ว 1 ใบ)";
            }
        }

        async function pullGacha() {
            let currentTickets = parseInt(agentData.tickets) || 0;
            if (currentTickets <= 0) { alert("ACCESS DENIED: ตั๋วหมด!"); return; }

            const vault = document.getElementById('vault-icon');
            const rewardBox = document.getElementById('reward-display');
            const pullBtn = document.getElementById('pull-btn');
            
            pullBtn.disabled = true; pullBtn.innerText = "DRAWING... ⏳"; playSound('spin');
            
            vault.style.transform = "rotate(20deg) scale(1.1)";
            setTimeout(() => vault.style.transform = "-rotate(20deg) scale(1.1)", 100);
            setTimeout(() => vault.style.transform = "rotate(15deg) scale(1.1)", 200);
            setTimeout(() => vault.style.transform = "-rotate(15deg) scale(1.1)", 300);
            setTimeout(() => vault.style.transform = "rotate(0deg) scale(1)", 400);

            const pool = [
                { type: 'hint', amount: 2, name: '🔍 แว่นขยาย x2', rarity: 'rarity-common' },
                { type: 'time', amount: 1, name: '⏳ นาฬิกาทราย x1', rarity: 'rarity-common' },
                { type: 'file', amount: 1, name: '📁 แฟ้มลับคำศัพท์ x1', rarity: 'rarity-common' },
                
                { type: 'frame', amount: 'common_frame.png', name: '🖼️ Bronze Frame', rarity: 'rarity-common' },
                { type: 'frame', amount: 'elite_frame.png', name: '🖼️ Elite Frame', rarity: 'rarity-rare' },
                { type: 'frame', amount: 'elite_platinum_frame.png', name: '🖼️ Platinum Frame', rarity: 'rarity-epic' },
                { type: 'frame', amount: 'elite_cyber_frame.png', name: '🖼️ Cyber Frame', rarity: 'rarity-epic' },
                { type: 'frame', amount: 'ultimate_frame.png', name: '✨ Ultimate Frame', rarity: 'rarity-legendary' },

                { type: 'skin', amount: 'rookie_detective.png', name: '🕵️ Rookie Detective', rarity: 'rarity-common' },
                { type: 'skin', amount: 'interpreter_spy.png', name: '🕵️ Interpreter Spy', rarity: 'rarity-rare' },
                { type: 'skin', amount: 'master_translator.png', name: '🕵️ Master Translator', rarity: 'rarity-epic' },
                { type: 'skin', amount: 'elite_agent_neon.png', name: '✨ Neon Agent', rarity: 'rarity-epic' },
                { type: 'skin', amount: 'legendary_master.png', name: '🌟 Legendary Master', rarity: 'rarity-legendary' },

                { type: 'skin', amount: 'agent_female_scout.png', name: '👩‍💼 Female Scout', rarity: 'rarity-common' },
                { type: 'skin', amount: 'agent_female_detective.png', name: '👩‍💼 Female Detective', rarity: 'rarity-rare' },
                { type: 'skin', amount: 'agent_female_elite.png', name: '👩‍💼 Female Elite', rarity: 'rarity-epic' },
                { type: 'skin', amount: 'agent_female_epic.png', name: '✨ Epic Agent', rarity: 'rarity-epic' },
                { type: 'skin', amount: 'legendary_female_scholar.png', name: '🌟 Legendary Scholar', rarity: 'rarity-legendary' }
            ];

            const won = pool[Math.floor(Math.random() * pool.length)];
            if (won.rarity === 'rarity-epic' || won.rarity === 'rarity-legendary') setTimeout(() => playSound('epic'), 400);

            setTimeout(() => { rewardBox.innerHTML = `🎉 ยินดีด้วย! คุณได้รับ:<br><span class="reward-name ${won.rarity}">${won.name}</span><br><span style="font-size:12px; color:#888;">อัปโหลดข้อมูลเข้าศูนย์บัญชาการ...</span>`; }, 400);

            try {
                const url = `${WEB_APP_URL}?action=updateScore&agentId=${encodeURIComponent(agentData.agentId)}&caseNum=0&expGain=0&score=0&ticketGain=-1&rewardType=${won.type}&rewardAmount=${won.amount}`;
                const response = await fetch(url);
                const result = await response.json();

                if (result.status === 'success') {
                    agentData.tickets = parseInt(result.newTickets) || 0;
                    agentData.ownedItems = result.newOwned; 
                    
                    if (won.type === 'skin') agentData.avatarId = won.amount;
                    if (won.type === 'frame') agentData.frameId = won.amount;
                    if (won.type === 'hint') agentData.itemHint = parseInt(agentData.itemHint || 0) + won.amount;
                    if (won.type === 'time') agentData.itemTime = parseInt(agentData.itemTime || 0) + won.amount;
                    if (won.type === 'file') agentData.itemFile = parseInt(agentData.itemFile || 0) + won.amount;

                    localStorage.setItem('agentData', JSON.stringify(agentData));
                    rewardBox.innerHTML = `🎉 ยินดีด้วย! คุณได้รับ:<br><span class="reward-name ${won.rarity}">${won.name}</span><br><span style="font-size:12px; color:#00aa00;">บันทึกข้อมูลสำเร็จ</span>`;
                } else {
                    alert("ERROR: " + result.message);
                    rewardBox.innerHTML = "กดตู้กาชา หรือปุ่มด้านล่างเพื่อเสี่ยงโชค!";
                }
            } catch (error) {
                alert("CONNECTION ERROR");
            } finally { updateTicketUI(); }
        }

        function goDashboard() { window.location.href = 'index.html'; }
    </script>
</body>
</html>
